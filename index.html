<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Let's cook!</title>
<style>
:root{--bg:#fbf0dc;--paper:#fffaf1;--paper2:#fff5e6;--ink:#2e2119;--muted:#78695d;--line:#ead8bd;--orange:#ff7b21;--orange2:#ff9f4b;--shadow:0 16px 45px #9a66301b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#fff8ea 0,#fbefd9 52%,#f8ead2 100%);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.top{height:72px;display:flex;align-items:center;padding:0 34px;border-bottom:1px solid #eadbc6;background:#fff9efcc;backdrop-filter:blur(16px);position:sticky;top:0;z-index:10}.brand{font:700 36px/1.1 "Comic Sans MS",cursive;letter-spacing:-1px}.brand small{font:400 13px/1 system-ui;color:#8c7d70;margin-left:18px}.top .spacer{flex:1}.user{padding:10px 16px;border:1px solid #eadbc6;border-radius:15px;background:#fffaf2}.app{max-width:1536px;margin:auto;padding:18px 28px 28px;display:grid;grid-template-columns:320px minmax(620px,1fr) 320px;gap:16px}.panel,.card{background:#fffaf3e8;border:1px solid #eadbc7;border-radius:22px;box-shadow:var(--shadow)}.left,.right{padding:14px;align-self:start}.recipe-head{display:grid;grid-template-columns:96px 1fr;gap:13px;padding:2px 2px 14px;border-bottom:1px solid var(--line)}.recipe-head img{width:96px;height:96px;object-fit:cover;border-radius:16px}.recipe-head h2{margin:7px 0 4px;font-size:21px}.meta{display:flex;gap:7px;margin-top:10px}.pill{background:#fff0df;color:#d95e11;padding:5px 9px;border-radius:999px;font-size:12px}.section-title{font-weight:800;margin:15px 5px 8px}.recipe-search{width:100%;border:1px solid var(--line);background:#fffdf8;padding:10px 12px;border-radius:13px;outline:none;margin:2px 0 8px}.recipe-picker{display:grid;gap:5px;max-height:300px;overflow:auto;padding-right:3px}.pick{border:0;background:transparent;display:grid;grid-template-columns:50px 1fr auto;gap:9px;align-items:center;text-align:left;padding:6px;border-radius:13px;color:inherit;cursor:pointer}.pick:hover,.pick.active{background:#ffedd6}.pick img{width:50px;height:42px;border-radius:10px;object-fit:cover}.pick b{display:block}.pick span{font-size:11px;color:#9b7a60}.ingredients{border-top:1px solid var(--line);margin-top:12px;padding-top:8px}.ing{display:flex;gap:10px;align-items:center;padding:6px}.ing .ico{width:22px;text-align:center}.ing .qty{margin-left:auto;color:#6f6257}.start{width:100%;border:0;border-radius:14px;background:linear-gradient(90deg,var(--orange),var(--orange2));color:#fff;font-weight:800;padding:13px;margin-top:12px;cursor:pointer}.center{min-width:0}.hero{position:relative;overflow:hidden;border-radius:26px;min-height:610px;background:#efd9ba;border:1px solid #ead3b3;box-shadow:var(--shadow)}.hero-media{position:absolute;inset:0}.hero-media img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .35s,transform .6s,filter .35s}.hero-media.illustration img{filter:saturate(.82) contrast(.96) brightness(1.05);transform:scale(1.015)}.hero-media.illustration:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,#fff5df20,#f7c98d18);mix-blend-mode:screen}.hero-media.loading img{filter:blur(18px);transform:scale(1.04)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#fff2 0,#0000 45%,#6a351926 100%);pointer-events:none}.step-card{position:absolute;z-index:2;left:18px;top:18px;width:min(330px,48%);padding:18px 20px;background:#fffaf2ed;border:1px solid #ead9c2;border-radius:20px;box-shadow:0 10px 30px #6e48231f}.step-card .eyebrow{color:var(--orange);font-weight:800;font-size:12px}.step-card h1{font-size:27px;margin:6px 0}.step-card p{margin:0;color:#66594f}.toggle{position:absolute;z-index:3;right:18px;top:18px;background:#fffaf2e8;padding:5px;border-radius:14px;border:1px solid #ead9c2;display:flex;gap:4px}.toggle button{border:0;background:transparent;padding:8px 13px;border-radius:10px;cursor:pointer}.toggle .active{background:var(--orange);color:white}.timer{position:absolute;z-index:3;left:22px;right:22px;bottom:18px;background:#fffaf2ed;border:1px solid #ead9c2;border-radius:22px;padding:14px 18px;display:grid;grid-template-columns:48px 1fr auto auto;align-items:center;gap:14px;box-shadow:0 10px 28px #68451d1f}.flame{font-size:31px}.timer b{display:block}.progress{height:7px;background:#eadcc8;border-radius:9px;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;width:45%;background:linear-gradient(90deg,var(--orange),var(--orange2));border-radius:9px}.clock{font-size:22px;font-weight:900}.pause{width:48px;height:48px;border-radius:50%;border:2px solid var(--orange);background:#fff8ec;color:var(--orange);font-weight:900;cursor:pointer}.recipe-strip{margin-top:12px;padding:10px 12px;border-radius:22px;background:#fffaf2c9;border:1px solid #eadbc7;box-shadow:var(--shadow);display:flex;gap:8px;overflow:auto}.recipe-chip{flex:0 0 118px;border:1px solid #eadbc7;background:#fffaf2;border-radius:14px;padding:6px;text-align:left;cursor:pointer}.recipe-chip.active{border:2px solid var(--orange);padding:5px}.recipe-chip img{width:100%;height:58px;object-fit:cover;border-radius:9px;display:block}.recipe-chip b{font-size:12px;display:block;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.recipe-chip small{color:#9a8b7d}.carousel{margin-top:14px;padding:14px;border-radius:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#fffaf2c9;border:1px solid #eadbc7;box-shadow:var(--shadow)}.step-thumb{border:1px solid #eadbc7;background:#fffaf2;border-radius:16px;padding:8px;text-align:left;cursor:pointer;min-width:0}.step-thumb.active{border:2px solid var(--orange);padding:7px}.step-thumb img{width:100%;height:90px;object-fit:cover;border-radius:11px;display:block}.step-thumb b{display:block;margin:7px 2px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.step-thumb small{color:#9a8b7d}.right{display:grid;gap:12px}.tip,.steps-box,.tools{padding:16px;border:1px solid #eadbc7;border-radius:18px;background:#fffaf2}.tip h3,.steps-box h3,.tools h3{margin:0 0 12px}.tip h3{color:#e56616}.tip p{color:#65594f;margin:0}.mini-step{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;margin:12px 0}.num{width:30px;height:30px;border-radius:50%;background:#ffe3c1;color:#dc671b;display:grid;place-items:center;font-weight:800}.mini-step p{margin:5px 0;color:#6c6056;font-size:13px}.tool-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tool{background:#fff2df;border:1px solid #eadbc7;border-radius:12px;padding:10px 4px;text-align:center;font-size:11px}.tool .icon{font-size:26px;display:block;margin-bottom:4px}.love{text-align:center;color:#c46b2e;font:700 18px/1.3 "Comic Sans MS",cursive;padding:5px 0 0}.error{padding:30px;text-align:center}
@media(max-width:1150px){.app{grid-template-columns:280px 1fr}.right{grid-column:1/-1;grid-template-columns:1fr 1fr 1fr}.love{display:none}.hero{min-height:560px}}@media(max-width:800px){.top{padding:0 16px}.brand{font-size:28px}.brand small{display:none}.app{display:block;padding:10px}.left,.center,.right{margin-bottom:12px}.recipe-picker{grid-template-columns:1fr 1fr;max-height:none}.ingredients{display:none}.hero{min-height:520px}.step-card{width:calc(100% - 36px)}.toggle{top:142px}.carousel{overflow:auto;grid-template-columns:repeat(4,180px)}.right{display:grid;grid-template-columns:1fr}.timer{grid-template-columns:42px 1fr auto}.clock{display:none}}
</style></head><body><header class="top"><div class="brand">👨‍🍳 Let's cook! <small>Вкусные рецепты — легко!</small></div><div class="spacer"></div><div class="user">🌙 &nbsp; 👤 sam &nbsp; <b style="color:#e76519">Выйти</b></div></header><main id="app" class="app"><div class="error">Загружаем рецепты…</div></main>
<script>
const FALLBACK='public/photos/fallback.svg';let recipes=[],recipe=null,step=0,mode='photo',running=false,seconds=192;
const icons=['🥣','🥄','🍳','🍴','🥛','🔪','🥘','🫕'];
function img(path,cls=''){return `<img class="${cls}" loading="lazy" src="${path}" onerror="this.onerror=null;this.src='${FALLBACK}'">`}
function render(){if(!recipe)return;const s=recipe.steps[step];document.querySelector('#app').innerHTML=`
<aside class="panel left"><div class="recipe-head">${img(recipe.images.dish)}<div><h2>${recipe.name}</h2><div style="color:#7f7165">${recipe.description}</div><div class="meta"><span class="pill">⏱ ${recipe.time}</span><span class="pill">🔥 ${recipe.difficulty}</span></div></div></div>
<div class="section-title">Выберите рецепт</div><input class="recipe-search" placeholder="🔎 Поиск рецепта…" oninput="filterRecipes(this.value)"><div class="recipe-picker" id="recipePicker">${recipes.map(r=>`<button class="pick ${r.id===recipe.id?'active':''}" onclick="choose('${r.id}')">${img(r.images.dish)}<span><b>${r.name}</b><span>${r.time} · ${r.difficulty}</span></span><span>›</span></button>`).join('')}</div>
<div class="ingredients"><div class="section-title">🛒 Ингредиенты</div>${recipe.ingredients.map((x,i)=>`<div class="ing"><span class="ico">${['🥛','🥚','🧂','🧈','🌿','🥕'][i%6]}</span><span>${x[0]}</span><span class="qty">${x[1]} ${x[2]}</span></div>`).join('')}</div><button class="start" onclick="toggleTimer()">▶ Начать готовить</button></aside>
<section class="center"><div class="hero"><div class="hero-media loading ${mode==='illustration'?'illustration':''}" id="media">${img(recipe.images.steps[step])}</div><div class="step-card"><div class="eyebrow">♨ Шаг ${step+1} из 4</div><h1>${s.name}</h1><p>${s.text}</p></div><div class="toggle"><button class="${mode==='illustration'?'active':''}" onclick="setMode('illustration')">Иллюстрация</button><button class="${mode==='photo'?'active':''}" onclick="setMode('photo')">Фото</button></div><div class="timer"><div class="flame">🔥</div><div><b>Готовим</b><span style="color:#7c7065">${s.name}</span><div class="progress"><i style="width:${((step+1)/recipe.steps.length)*100}%"></i></div></div><div class="clock" id="clock">${fmt(seconds)}</div><button class="pause" onclick="toggleTimer()">${running?'Ⅱ':'▶'}</button></div></div>
<div class="carousel">${recipe.steps.map((x,i)=>`<button class="step-thumb ${i===step?'active':''}" onclick="setStep(${i})">${img(recipe.images.steps[i])}<b>${i+1}. ${x.name}</b><small>◷ ${x.time}</small></button>`).join('')}</div><div class="recipe-strip">${recipes.map(r=>`<button class="recipe-chip ${r.id===recipe.id?'active':''}" onclick="choose('${r.id}')">${img(r.images.dish)}<b>${r.name}</b><small>${r.time}</small></button>`).join('')}</div></section>
<aside class="panel right"><div class="tip"><h3>💡 Совет шефа</h3><p>${recipe.tip}</p></div><div class="steps-box"><h3>📖 Пошаговый рецепт</h3>${recipe.steps.map((x,i)=>`<div class="mini-step"><span class="num">${i+1}</span><p><b>${x.name}</b><br>${x.text}</p></div>`).join('')}</div><div class="tools"><h3>🛠 Вам понадобится</h3><div class="tool-grid">${recipe.tools.map((t,i)=>`<div class="tool"><span class="icon">${icons[i%icons.length]}</span>${t}</div>`).join('')}</div></div><div class="love">♡ Вкусные моменты<br>создаём вместе ♡</div></aside>`;
requestAnimationFrame(()=>{const m=document.querySelector('#media');const im=m?.querySelector('img');if(im){if(im.complete)m.classList.remove('loading');else im.onload=()=>m.classList.remove('loading')}})}
function filterRecipes(q){q=q.toLowerCase().trim();document.querySelectorAll('#recipePicker .pick').forEach(b=>b.style.display=b.innerText.toLowerCase().includes(q)?'grid':'none')}
function choose(id){recipe=recipes.find(r=>r.id===id);step=0;seconds=192;preloadNeighbors();render()}function setStep(i){step=i;seconds=192;preloadNeighbors();render()}function setMode(m){mode=m;render()}function fmt(v){return `${String(Math.floor(v/60)).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`}function toggleTimer(){running=!running;render()}
setInterval(()=>{if(running&&seconds>0){seconds--;const c=document.querySelector('#clock');if(c)c.textContent=fmt(seconds)}},1000);
function preloadRecipe(r){if(!r)return;[r.images.dish,...r.images.steps].forEach(src=>{const im=new Image();im.src=src})}
function preloadNeighbors(){preloadRecipe(recipe);const i=recipes.findIndex(r=>r.id===recipe.id);preloadRecipe(recipes[i+1]);preloadRecipe(recipes[i-1])}
fetch('data/recipes.json').then(r=>r.json()).then(d=>{recipes=d;recipe=d[0];preloadNeighbors();render()}).catch(e=>document.querySelector('#app').innerHTML='<div class="error">Не удалось загрузить data/recipes.json. Запусти проект через локальный сервер.</div>');
</script></body></html>
